name: Central VitalVeg V9 CI

on:
  push:
    branches: ["ai-employee-v9"]
  pull_request:
    branches: ["v8-production"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact production dependencies
        run: npm ci --ignore-scripts
      - name: Validate frontend and backend syntax
        run: |
          node --check app.js
          node --check auth.js
          node --check v9/v9.js
          node --check v9/ops-summary.js
          node --check v9/review-ux.js
          node --check v9/mode-ui.js
          node --check v9/shadow.js
          node --check v9/print.js
          node --check v9/push.js
          for f in netlify/functions/*.mts; do
            node --experimental-strip-types --check "$f"
          done
      - name: Test deterministic business rules
        run: node --experimental-strip-types --test tests/*.test.mts
