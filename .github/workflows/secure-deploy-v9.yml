name: Secure Deploy Central VitalVeg V9

on:
  push:
    branches: [ai-employee-v9]
    paths:
      - DEPLOY_TRIGGER_V9.txt

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-employee-v9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse incomplete branding
        run: |
          set -euo pipefail
          test -f assets/vitalveg-logo-original.png || {
            echo "ERRO: falta assets/vitalveg-logo-original.png. A V9 não pode ser publicada com um logótipo inventado." >&2
            exit 1
          }

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Validate V9 release candidate
        run: |
          set -euo pipefail
          node --check v9/v9.js
          node --check v9/ops-summary.js
          node --check v9/review-ux.js
          node --check v9/mode-ui.js
          node --check v9/shadow.js
          node --check v9/print.js
          node --check v9/push.js
          for f in netlify/functions/*.mts; do
            node --experimental-strip-types --check "$f"
          done
          node --experimental-strip-types --test tests/*.test.mts

      - name: Prepare clean V9 production directory
        run: |
          set -euo pipefail
          DEST=/tmp/vitalveg-v9-deploy
          rm -rf "$DEST"
          mkdir -p "$DEST/netlify/functions" "$DEST/assets"
          cp v9/index.html v9/v9.css v9/v9.js v9/ops-summary.css v9/ops-summary.js v9/health.css v9/review-ux.js v9/mode-ui.js v9/shadow.html v9/shadow.css v9/shadow.js v9/print.html v9/print.css v9/print.js v9/push.js v9/sw.js "$DEST/"
          if [ -f v9/manifest.json ]; then cp v9/manifest.json "$DEST/"; fi
          cp assets/vitalveg-logo-original.png "$DEST/assets/"
          cp netlify/functions/*.mts "$DEST/netlify/functions/"
          cp package.json package-lock.json "$DEST/"
          cat > "$DEST/netlify.toml" <<'EOF'
          [build]
            publish = "."
            functions = "netlify/functions"

          [functions]
            node_bundler = "esbuild"
          EOF
          echo "$DEST" > /tmp/deploy-dir.txt

      - name: Generate one-time deployment key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:8192 -out /tmp/deploy-private.pem 2>/dev/null
          openssl pkey -in /tmp/deploy-private.pem -pubout -out /tmp/deploy-public.pem

      - name: Publish public encryption key
        uses: actions/upload-artifact@v4
        with:
          name: deploy-v9-public-key-${{ github.run_id }}
          path: /tmp/deploy-public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted Netlify authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET=".deploy/v9-proxy-${GITHUB_RUN_ID}.b64"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TARGET}?ref=ai-employee-v9"
          echo "Waiting for one-time encrypted Netlify authorization..."
          found=0
          for i in $(seq 1 120); do
            if curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" -o /tmp/proxy.b64; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo "Encrypted authorization was not received in time." >&2
            exit 1
          fi
          base64 -d /tmp/proxy.b64 > /tmp/proxy.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/deploy-private.pem \
            -in /tmp/proxy.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/proxy.txt
          PROXY="$(cat /tmp/proxy.txt)"
          case "$PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Invalid deployment authorization." >&2; exit 1 ;;
          esac
          echo "::add-mask::$PROXY"
          chmod 600 /tmp/proxy.txt /tmp/deploy-private.pem

      - name: Deploy V9 to existing VitalVeg production site
        run: |
          set -euo pipefail
          PROXY="$(cat /tmp/proxy.txt)"
          cd "$(cat /tmp/deploy-dir.txt)"
          npx -y @netlify/mcp@latest \
            --site-id f9a17204-1189-4e33-89ef-f2ea988a4362 \
            --proxy-path "$PROXY"

      - name: Smoke test public V9
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            HTML="$(curl -fsSL --max-time 15 https://vitalveg-central.netlify.app/ || true)"
            if printf '%s' "$HTML" | grep -q "Funcionário Digital"; then
              break
            fi
            sleep 5
          done
          printf '%s' "$HTML" | grep -q "Funcionário Digital"
          curl -fsSL --max-time 15 https://vitalveg-central.netlify.app/ops-summary.js | grep -q "Resumo de preparação"
          curl -fsSL --max-time 15 https://vitalveg-central.netlify.app/health.css | grep -q "ai-health-banner"
          curl -fsSL --max-time 15 https://vitalveg-central.netlify.app/shadow.html | grep -q "Validação da Inteligência Artificial"
          curl -fsSL --max-time 15 https://vitalveg-central.netlify.app/api/auth | grep -q 'pinConfigured'

      - name: Remove sensitive temporary files
        if: always()
        run: |
          rm -f /tmp/proxy.txt /tmp/proxy.enc /tmp/proxy.b64 /tmp/deploy-private.pem /tmp/deploy-public.pem
